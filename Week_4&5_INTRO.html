<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/gif" href="Images-Ass2/potato.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            
        }

        .w4-button,
        .w5-button,
        .hng-button {
            
            position: fixed;
            z-index: 100;
            padding: 15px 25px;
        }

        .w4-button {
            top: 20px;
            right: 20px;
        }

        .w5-button {
            top: 70px;
            right: 20px;
        }

        .hng-button {
            top: 120px;
            right: 20px;
        }

        button {
            font-family: 'Courier New', Courier, monospace;
            font-weight: bolder;
            padding: 10px 20px;
            font-size: 16px;
            background-color: rgba(255, 255, 255, 0.9);
            border: 2px solid black;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            background-color: rgba(0, 255, 64, 0.8);
            color: white;
        }

        a {
            text-decoration: none;
        }
    </style>
    <body>
        <div class="w4-button">
            <a href="Week_4_work.html">
                <button>Week 4</button>
            </a>
        </div>

        <div class="w5-button">
            <a href="Week_5_work.html">
                <button>Week 5</button>
            </a>
        </div>

        <div class="hng-button">
            <a href="W4&5_HNG.html">
                <button>Hunted and gathered (W4-W5)</button>
        </div>

    </body>
    <!-- credits to https://openprocessing.org/@jcponcemath/2830909 -->
    <script>
        
        let codeLines = [];
let fontSize = 22;
let lineHeight = 30;
let margin = 70;

let scrollSpeed = 35; // frames between new lines
let frameCounter = 0;
let nextY;

// Typing state
let typingSpeed = 1; // frames per character
let typingCounter = 0;
let currentSnippet = "";
let currentIndex = 0;
let isTyping = false;

// Cursor
let cursorBlinkSpeed = 10;
let cursorVisible = true;
let cursorCounter = 0;
let cursorSize = 16;

let funSnippets = [
"Hi",
"What's your name?",
"My name is -... .. .-.. .-.. -.--",
"You won't see me again after this",
"My home will look different",
"Please don't be shocked",
"O(∩_∩)O",
"<(• . • )>",
"=.=",
"(▀̿Ĺ̯▀̿ ̿)",
"(￣o￣) . z Z"
];

function setup() {
  createCanvas(windowWidth, windowHeight);
  textFont("monospace");
  textSize(fontSize);
  frameRate(60);

  nextY = height / 2;
}

function draw() {
  background(0, 70);

  // Draw all lines
  for (let line of codeLines) {
    drawGlowingText(line.text, line.x, line.y);
  }

  // Cursor blink logic
  cursorCounter++;
  if (cursorCounter >= cursorBlinkSpeed) {
    cursorCounter = 0;
    cursorVisible = !cursorVisible;
  }

  // Start typing a new line after a pause
  frameCounter++;
  if (frameCounter >= scrollSpeed && !isTyping) {
    frameCounter = 0;
    startTyping();
  }

  // Type characters
  if (isTyping) {
    typeCharacter();
  }

  // Draw cursor
  if (cursorVisible && codeLines.length > 0) {
    drawCursor();
  }
}

// -------------------------
// Typing control
// -------------------------
function startTyping() {
  currentSnippet = random(funSnippets);
  currentIndex = 0;
  isTyping = true;

  codeLines.push({
    text: "",
    x: margin,
    y: nextY
  });
}

function typeCharacter() {
  typingCounter++;
  if (typingCounter < typingSpeed) return;
  typingCounter = 0;

  let currentLine = codeLines[codeLines.length - 1];
  currentLine.text += currentSnippet[currentIndex];
  currentIndex++;

  if (currentIndex >= currentSnippet.length) {
    isTyping = false;
    nextY += lineHeight;
    handleScroll();
  }
}

// -------------------------
// Scrolling logic
// -------------------------
function handleScroll() {
  if (nextY + lineHeight > height - margin) {
    for (let line of codeLines) {
      line.y -= lineHeight;
    }
    nextY -= lineHeight;
  }

  codeLines = codeLines.filter(
    line => line.y > margin - lineHeight
  );
}

// -------------------------
// Cursor
// -------------------------
function drawCursor() {
  let lastLine = codeLines[codeLines.length - 1];
  let cursorX = lastLine.x + textWidth(lastLine.text) + 6;
  let cursorY = lastLine.y - fontSize + 4;

  drawingContext.shadowBlur = 6;
  drawingContext.shadowColor = color(0, 255, 70);

  noStroke();
  fill(0, 255, 70);
  rect(cursorX, cursorY, cursorSize, cursorSize);

  drawingContext.shadowBlur = 0;
}

// -------------------------
// Glowing text
// -------------------------
function drawGlowingText(txt, x, y) {
  for (let i = 4; i > 0; i--) {
    fill(0, 255, 70, 40 * i);
    text(txt, x, y);
  }
  fill(0, 255, 70);
  text(txt, x, y);
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);

  // Clear all previous lines
  codeLines = [];

  // Reset typing state
  isTyping = false;
  currentSnippet = "";
  currentIndex = 0;
  typingCounter = 0;
  frameCounter = 0;

  // Reset cursor
  cursorCounter = 0;
  cursorVisible = true;

  // Reset starting position
  nextY = height / 2;
}
    </script>
</html>
