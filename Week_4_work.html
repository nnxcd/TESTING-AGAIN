<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P5.js Grid Sketches</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <style>
        @font-face {
            font-family: 'neuemetana';
            src: url(Fonts/NeueMetana-Regular.otf) format('truetype');
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'neuemetana', sans-serif;
            background-color: #ffffff;
            overflow: hidden;
        }
        
        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(2, 1fr);
            width: 100vw;
            height: 100vh;
            gap: 0;
        }
        
        .grid-item {
            position: relative;
            
            overflow: hidden;
        }
        
        .sketch-container {
            width: 100%;
            height: 100%;
        }

        #sketch7 {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        #sketch7 h1 {
            font-family: 'neuemetana', sans-serif;
            font-size: clamp(2.5em, 6vw, 3.5em);
            color: #000000;
            text-align: center;
            margin: 2vh;
            line-height: 1.2;
            word-wrap: break-word;
            max-width: 100%;
        }

        #sketch7 a {
            margin-top: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #90049f;
        }

        
    </style>
</head>
<body>
    <div class="grid-container">
        <div class="grid-item"><div class="sketch-container" id="sketch1"></div></div>
        <div class="grid-item"><div class="sketch-container" id="sketch2"></div></div>
        <div class="grid-item"><div class="sketch-container" id="sketch3"></div></div>
        <div class="grid-item"><div class="sketch-container" id="sketch4"></div></div>
        <div class="grid-item"><div class="sketch-container" id="sketch5"></div></div>
        <div class="grid-item"><div class="sketch-container" id="sketch6"></div></div>
        <div class="grid-item">
            <div class="sketch-container" id="sketch7">
                <h1> P5.js Experiment</h1>
                <a href="index.html">
                <p> home </p>
                </a>
            </div>
        </div>
        <div class="grid-item"><div class="sketch-container" id="sketch8"></div></div>
    </div>

    <script>
    // credits of grid to https://editor.p5js.org/Tiri/sketches/Sk_-uQu6

        // Sketch 1 - Source 1
        const sketch1 = (p) => {
            p.setup = function() {
                p.createCanvas(p.windowWidth / 4, p.windowHeight / 2);
                p.background(255, 249, 54);
                p.rectMode(p.CENTER);
                p.textSize(20);
            }
            
            p.draw = function() {
                p.background(200, 200, 30, 16);
                p.circle(p.mouseX, p.mouseY, 170);
                p.fill("pink");
                p.text("BOOM", p.mouseX, p.mouseY);
                p.line(p.width / 2, p.height, p.mouseX, p.mouseY);
            }
        }
        new p5(sketch1, 'sketch1');

        // Sketch 2 - Source 2
        const sketch2 = (p) => {
            p.setup = function() {
                p.createCanvas(p.windowWidth / 4, p.windowHeight / 2);
                p.background("black");
                p.rectMode(p.CENTER);
                p.textSize(20);
            }
            
            p.draw = function() {
                p.background(255, 182, 193, 16);
                p.textSize(p.random(50));
                p.text("WAW", p.mouseX, p.mouseY);
                p.circle(p.random(p.width), p.random(p.height), p.random(50));
            }
        }
        new p5(sketch2, 'sketch2');

        // Sketch 3 - Source 3
        const sketch3 = (p) => {
            p.setup = function() {
                p.createCanvas(p.windowWidth / 4, p.windowHeight / 2);
                p.background("pink");
                p.rectMode(p.CENTER);
                p.textSize(5);
            }
            
            p.draw = function() {
                p.background(200, 100, 30, 16);
                p.circle(p.random(p.width), p.random(p.height), p.random(60));
                p.textSize(p.random(40));
                p.fill(0);
                p.text("WAW", p.mouseX, p.mouseY);
            }
        }
        new p5(sketch3, 'sketch3');

        // Sketch 4 - Source 4
        const sketch4 = (p) => {
            p.setup = function() {
                p.createCanvas(p.windowWidth / 4, p.windowHeight / 2);
                p.background(255, 249, 54);
                p.rectMode(p.CENTER);
                p.textSize(20);
            }
            
            p.draw = function() {
                p.background(200, 200, 30, 16);
                p.circle(p.mouseX, p.mouseY, 170);
                p.fill("pink");
                p.text("BOOM", p.mouseX, p.mouseY);
                p.line(p.width / 2, p.height, p.mouseX, p.mouseY);
            }
        }
        new p5(sketch4, 'sketch4');

        // Sketch 5 - Source 5
        const sketch5 = (p) => {
            p.setup = function() {
                p.createCanvas(p.windowWidth / 4, p.windowHeight / 2);
                p.background(0);
                p.rectMode(p.CENTER);
                p.textSize(20);
            }
            
            p.draw = function() {
                p.background(0, 16);
                p.fill(p.random(255), p.random(255), p.random(255));
                p.circle(p.mouseX, p.mouseY, p.random(80));
            }
        }
        new p5(sketch5, 'sketch5');

        // Sketch 6 - Source 6
        const sketch6 = (p) => {
            p.setup = function() {
                p.createCanvas(p.windowWidth / 4, p.windowHeight / 2);
                p.background(0);
                p.rectMode(p.CENTER);
                p.textSize(40);
                p.frameRate(20);
            }
            
            p.draw = function() {
                p.background(0, 16);
                p.circle(p.mouseX, p.mouseY, 30 - Math.abs(p.pmouseX - p.mouseX));
                p.textSize(p.random(100));
                p.stroke(255);
                p.strokeWeight((50 - Math.abs(p.pmouseX - p.mouseX)) / 4);
                
                if (p.mouseIsPressed) {
                    p.fill("red");
                    p.stroke("red");
                } else {
                    p.fill("white");
                    p.stroke("white");
                }
                p.line(p.pmouseX, p.pmouseY, p.mouseX, p.mouseY);
            }
        }
        new p5(sketch6, 'sketch6');

        // Handle window resize
        window.addEventListener('resize', () => {
            location.reload();
        });

        

        

        //Sketch 8 - Source 8 
        const sketch8 = (p) => {
            p.setup = function() {
                // size canvas to its container so it fits the grid cell
                const holder = document.getElementById('sketch8');
                const w = Math.max(100, holder.clientWidth);
                const h = Math.max(100, holder.clientHeight);
                p.createCanvas(w, h);
                p.background(191, 209, 255);
                p.rectMode(p.CENTER);
            }

            p.draw = function() {
                // original artwork was designed for ~1000x800; scale to fit
                const baseW = 1000;
                const baseH = 800;
                const s = Math.min(p.width / baseW, p.height / baseH);
                const dx = (p.width - baseW * s) / 2;
                const dy = (p.height - baseH * s) / 2;

                p.clear();
                p.background(191, 209, 255);
                p.push();
                p.translate(dx, dy);
                p.scale(s);

                p.fill("black");
                p.rect(500, 485, 400, 500, 300, 300, 0, 0);

                p.fill(237, 208, 177);
                p.rect(500, 500, 300, 350, 100, 400, 300, 300);

                p.fill(255, 255, 255);
                p.circle(420, 420, 55);

                p.fill(100, 100, 100);
                p.circle(420, 420, 30);

                p.fill(255, 255, 255);
                p.circle(570, 420, 55);

                p.fill(100, 100, 100);
                p.circle(570, 420, 30);

                p.fill(237, 208, 177);
                p.triangle(495, 420, 470, 500, 530, 500);

                p.fill("pink");
                p.arc(500, 550, 100, 100, p.TWO_PI, p.PI);

                p.pop();
            }
        }
        new p5(sketch8, 'sketch8');

        //Sketch 9 - placeholder
        const sketch9 = (p) => {
        }
        
    </script>
</body>
</html>
